services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_predictions
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_predictions"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_test
      POSTGRES_USER: sports_test
      POSTGRES_PASSWORD: sports_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_test -d sports_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgdata_test:
