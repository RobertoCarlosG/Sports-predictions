name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_test
          POSTGRES_USER: sports_test
          POSTGRES_PASSWORD: sports_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests reach Postgres here; unit tests use in-memory SQLite.
      TEST_DATABASE_URL: postgresql+asyncpg://sports_test:sports_test@localhost:5433/sports_test
      # A parseable default so importing the app never trips on a missing/HTTPS DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://sports_test:sports_test@localhost:5433/sports_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install OpenMP runtime (xgboost)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff + black)
        run: |
          ruff check src tests
          black --check src tests

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (build + karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Unit tests (headless)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test -- --no-watch --browsers=ChromeHeadlessNoSandbox
