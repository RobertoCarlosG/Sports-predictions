<div class="mlb-layout">
  <nav class="mlb-subnav" aria-label="Vistas MLB">
    <div class="seg-track" [style.--active-index]="activeIndex()">
      <div class="seg-pill" aria-hidden="true"></div>
      <a routerLink="/mlb/today"    [class.seg-on]="activeIndex() === 0">Hoy</a>
      <a routerLink="/mlb/tomorrow" [class.seg-on]="activeIndex() === 1">Mañana</a>
      <a routerLink="/mlb/week"     [class.seg-on]="activeIndex() === 2">Semana</a>
      <a routerLink="/mlb/history"  [class.seg-on]="activeIndex() === 3">Historial</a>
    </div>
  </nav>
  <router-outlet />
</div>
