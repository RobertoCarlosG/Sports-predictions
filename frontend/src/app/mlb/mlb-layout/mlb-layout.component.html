<div class="mlb-layout">
  <nav class="mlb-subnav" aria-label="Vistas MLB">
    <div class="seg-track" [style.--active-index]="activeIndex()">
      <div class="seg-pill" aria-hidden="true"></div>
      <a routerLink="/mlb/today"    routerLinkActive="seg-on" [routerLinkActiveOptions]="{exact:true}">Hoy</a>
      <a routerLink="/mlb/tomorrow" routerLinkActive="seg-on" [routerLinkActiveOptions]="{exact:true}">Mañana</a>
      <a routerLink="/mlb/week"     routerLinkActive="seg-on" [routerLinkActiveOptions]="{exact:true}">Semana</a>
      <a routerLink="/mlb/history"  routerLinkActive="seg-on" [routerLinkActiveOptions]="{exact:true}">Historial</a>
    </div>
  </nav>
  <router-outlet />
</div>
